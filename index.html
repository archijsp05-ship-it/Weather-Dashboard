<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>🌤️ Weather Dashboard</h1>

    <form id="search-form" class="search" autocomplete="off">
      <input
        id="city-input"
        type="text"
        placeholder="Search city (e.g. Bhopal, London, Tokyo)"
        aria-label="City name"
        required
      />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="current" class="card hidden" aria-label="Current weather">
      <div class="current-top">
        <div>
          <h2 id="location"></h2>
          <p id="condition" class="muted"></p>
        </div>
        <div class="icon" id="icon"></div>
      </div>
      <p class="temp" id="temp"></p>
      <div class="metrics">
        <div class="metric"><span>Feels like</span><strong id="feels"></strong></div>
        <div class="metric"><span>Humidity</span><strong id="humidity"></strong></div>
        <div class="metric"><span>Wind speed</span><strong id="wind"></strong></div>
      </div>
      <p id="updated" class="muted small"></p>
    </section>

    <section id="forecast-wrap" class="hidden" aria-label="5-day forecast">
      <h3>5-Day Forecast</h3>
      <div id="forecast" class="forecast"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
